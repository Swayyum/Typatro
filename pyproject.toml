[project]
name = "typatro"
version = "1.0.0"
description = "TYPATRO — a slot-machine typing roguelike for your terminal"
readme = "README.md"
license = { text = "GPL v3" }
authors = [{ name = "swayam" }]
requires-python = ">=3.9"
dependencies = [
    "textual>=3.2.0",
    "click>=8.1.7",
    "requests>=2.31.0",
    "platformdirs>=4.3.6",
]

[project.scripts]
typatro = "typatro.__main__:main"

[dependency-groups]
dev = [
    "pre-commit>=2.17.0",
    "textual-dev>=1.6.1",
    "ruff>=0.6.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["typatro"]

[tool.ruff]
exclude = ["venv"]
lint.ignore = ["F405"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
