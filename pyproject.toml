[project]
name = "typatro"
version = "1.0.3"
description = "TYPATRO — a slot-machine typing roguelike for your terminal"
readme = "README.md"
license = "GPL-3.0-only"
authors = [{ name = "swayam", email = "83102445+Swayyum@users.noreply.github.com" }]
requires-python = ">=3.9"
keywords = ["typing", "tui", "terminal", "game", "textual"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Terminals",
]
dependencies = [
    "textual>=3.2.0",
    "click>=8.1.7",
    "requests>=2.31.0",
    "platformdirs>=4.3.6",
    "pygame-ce>=2.5.0",
    "Pillow>=10.0.0",
]

[project.urls]
Homepage = "https://github.com/Swayyum/Typatro"
Repository = "https://github.com/Swayyum/Typatro"
Issues = "https://github.com/Swayyum/Typatro/issues"

[dependency-groups]
dev = [
    "pre-commit>=2.17.0",
    "textual-dev>=1.6.1",
    "ruff>=0.6.8",
    "build>=1.2.0",
    "twine>=6.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["typatro*"]

[tool.setuptools.package-data]
typatro = ["ui/css/**/*.tcss", "assets/*.mp3", "assets/jokers/*.jpeg", "assets/jokers/*.art.json"]

[project.scripts]
typatro = "typatro.__main__:main"

[tool.ruff]
exclude = ["venv"]
lint.ignore = ["F405"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
